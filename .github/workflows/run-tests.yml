name: Run Playwright Test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30          # 실제 소요 시간을 보고 더 줄이세요
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start OrangeHRM (Docker Compose)
        run: docker compose up -d

      - name: Wait for OrangeHRM to be ready
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200\|302"; then
              echo "OrangeHRM is up!"
              exit 0
            fi
            echo "Waiting for OrangeHRM... ($i)"
            sleep 5
          done
          echo "OrangeHRM did not start in time"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Generate one-time admin password
        run: |
          PW="Aa1!$(openssl rand -hex 12)"
          echo "::add-mask::$PW"
          echo "ADMIN_PW=$PW" >> "$GITHUB_ENV"

      - name: Run Playwright tests
        run: npx playwright test
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

      - name: Upload HTML report (Pages 게시용)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results (디버깅용)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down -v