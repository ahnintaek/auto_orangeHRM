name: Run Playwright Test

on:
  workflow_call:

# 이 워크플로가 저장소에 대해 가지는 권한을 "읽기"로 제한한다. (쓰기 권한은 배포 잡만 가짐)
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start OrangeHRM (Docker Compose)
        run: docker compose up -d

      - name: Wait for OrangeHRM to be ready
        run: |
          for i in {1..30}; do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:8080 | grep -q "200\|302"; then
              echo "OrangeHRM is up!"
              exit 0
            fi
            echo "Waiting for OrangeHRM... ($i)"
            sleep 5
          done
          echo "OrangeHRM did not start in time"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test
        env:
          ADMIN_ID: ${{ secrets.ADMIN_ID }}
          ADMIN_PW: ${{ secrets.ADMIN_PW }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

      # 공개 Pages에 올라갈 HTML 리포트만 따로 업로드한다.
      - name: Upload HTML report (Pages 게시용)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # trace/비디오가 든 test-results는 Actions 아티팩트로만 보관한다. (Pages에는 올리지 않음)
      - name: Upload test results (디버깅용)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down -v